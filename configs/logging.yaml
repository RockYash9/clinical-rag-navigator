version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/clinical_rag.log
    maxBytes: 10485760   # 10MB
    backupCount: 5

root:
  level: INFO
  handlers: [console, file]

loggers:
  # These libraries log every HTTP HEAD request / cache check at INFO,
  # which is useful for debugging but drowns out the CLI's own output.
  # Still logged to file at INFO for troubleshooting; just quieted on console.
  httpx:
    level: WARNING
    handlers: [file]
    propagate: false
  huggingface_hub:
    level: WARNING
    handlers: [file]
    propagate: false
  sentence_transformers:
    level: WARNING
    handlers: [file]
    propagate: false
